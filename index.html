<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brunna Paternostro · Illustrator &amp; Graphic Design</title>
<meta name="description" content="Brunna Paternostro (@_.brupater): ilustração e design gráfico. Projetos, portfólio, agenda e encomendas.">
<meta name="theme-color" content="#EFE6E1">
<link rel="icon" href="assets/avatar.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/site.css">
<!-- sem defer: aplicam cor e fonte escolhidas no painel antes da página aparecer -->
<script src="js/dados.js"></script>
<script src="js/loja.js"></script>
<script src="js/tema.js"></script>
<script src="js/layout.js" defer></script>
<script src="js/icones.js" defer></script>
<script src="js/cinema.js" defer></script>
<script src="js/agenda.js" defer></script>
<script src="js/site.js" defer></script>
<script src="js/vitrine.js" defer></script>
<script src="js/projetos.js" defer></script>
</head>
<body data-pagina="inicio" class="pg-clara">

<div class="cortina" aria-hidden="true"></div>

<main id="topo">

<!-- ===== topo: carrossel de destaques (fundo claro) ===== -->
<section class="vitrine" id="abertura" data-topo aria-roledescription="carrossel" aria-label="Artes em destaque">
  <div class="vit-palco" id="vit-palco" aria-live="off"></div>
  <div class="vit-veu" aria-hidden="true"></div>

  <div class="wrap vit-conteudo">
    <header class="vit-cab">
      <p class="rotulo vit-kicker" id="ab-kicker"></p>
      <div class="vit-status" id="ab-status"></div>
    </header>

    <div class="vit-base">
      <div class="vit-info">
        <h1 class="so-leitor" id="ab-h1"></h1>
        <p class="vit-frase t-mao" id="ab-frase"></p>
        <p class="vit-legenda" id="ab-legenda"></p>
        <div class="vit-ctas">
          <a class="btn cheio" href="encomendas.html">Fazer encomenda</a>
          <a class="btn" href="#projetos">Ver projetos</a>
          <a class="btn trilha" id="ab-trilha" href="#" target="_blank" rel="noopener" hidden>
            <span aria-hidden="true">&#9654;</span> <span id="ab-trilha-txt"></span>
          </a>
        </div>
      </div>
      <div class="vit-lado">
        <button type="button" class="vit-ampliar" id="vit-ampliar"><span aria-hidden="true">&#10530;</span> <span class="txt">ver arte inteira</span></button>
        <div class="vit-miniaturas" id="vit-miniaturas" role="tablist" aria-label="Escolher arte"></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== projetos (coleções): só a capa aqui; o projeto inteiro abre em projeto.html ===== -->
<section class="projetos" id="projetos" aria-labelledby="projetos-t">
  <div class="wrap">
    <header class="projetos-cab">
      <div>
        <h2 class="projetos-t t-cinema surge" id="projetos-t"></h2>
        <p class="projetos-sub surge" id="projetos-sub"></p>
      </div>
      <div class="proj-filtros" id="proj-filtros" role="group" aria-label="Filtrar projetos"></div>
    </header>
    <div class="proj-grade" id="proj-grade"></div>
  </div>
</section>

<!-- ===== créditos iniciais: links ===== -->
<section class="creditos-ini" id="creditos" aria-labelledby="creditos-t">
  <div class="wrap">
    <h2 class="rotulo creditos-t surge" id="creditos-t">créditos iniciais · onde me achar</h2>
    <div class="links" id="links"></div>
  </div>
</section>

<!-- ===== ficha (pôster) ===== -->
<section class="ficha papel" id="ficha" aria-labelledby="ficha-nome">
  <div class="wrap ficha-in">
    <div class="ficha-topo surge">
      <img class="ficha-retrato js-avatar" id="ficha-retrato" src="assets/avatar.webp" width="150" height="150" alt="Autorretrato da Brunna em ilustração">
      <div>
        <p class="rotulo ficha-cena">ficha da personagem</p>
        <h2 class="ficha-nome t-poster" id="ficha-nome"></h2>
        <p class="ficha-lista" id="ficha-lista"></p>
      </div>
    </div>
    <p class="ficha-extra surge" id="ficha-extra"></p>

    <div class="ficha-palco">
      <p class="ficha-palavra t-poster" id="ficha-palavra" aria-hidden="true"></p>
      <img class="ficha-arte" id="ficha-arte" src="assets/obras/hey.webp" width="1080" height="1080" alt="Ilustração da Brunna: a tiefling de cabelo rosa acenando" loading="lazy">
    </div>

    <div class="ficha-base">
      <p class="ficha-texto surge" id="ficha-texto"></p>
      <div class="ficha-lema surge">
        <p class="t-poster" id="ficha-lema"></p>
        <p class="rotulo">copyright <span id="ano"></span>&copy;</p>
        <div class="barcode" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== interlúdio 1 ===== -->
<section class="interludio" id="interludio1" aria-label="Interlúdio">
  <div class="interludio-img"></div>
  <div class="barra-cine topo" aria-hidden="true"></div>
  <div class="barra-cine base" aria-hidden="true"></div>
  <blockquote class="interludio-frase wrap surge">
    <p class="t-cinema"></p>
    <cite class="rotulo"></cite>
  </blockquote>
</section>

<!-- ===== próximas cenas: as outras páginas ===== -->
<section class="proximas" aria-labelledby="proximas-t">
  <div class="wrap">
    <h2 class="rotulo proximas-t surge" id="proximas-t">próximas cenas</h2>
    <div class="chamadas" id="chamadas"></div>
  </div>
</section>

<!-- ===== interlúdio 2 ===== -->
<section class="interludio" id="interludio2" aria-label="Interlúdio">
  <div class="interludio-img"></div>
  <div class="barra-cine topo" aria-hidden="true"></div>
  <div class="barra-cine base" aria-hidden="true"></div>
  <blockquote class="interludio-frase wrap surge">
    <p class="t-cinema"></p>
    <cite class="rotulo"></cite>
  </blockquote>
</section>

</main>

</body>
</html>
