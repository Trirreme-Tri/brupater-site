<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brunna Paternostro · RPG Character Creation</title>
<meta name="description" content="Brunna Paternostro (@_.brupater): ilustração de personagens de RPG, portfólio, agenda e encomendas.">
<meta name="theme-color" content="#0E0A0F">
<link rel="icon" href="assets/avatar.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/site.css">
<!-- sem defer: aplicam cor e fonte escolhidas no painel antes da página aparecer -->
<script src="js/dados.js"></script>
<script src="js/loja.js"></script>
<script src="js/tema.js"></script>
<script src="js/layout.js" defer></script>
<script src="js/icones.js" defer></script>
<script src="js/cinema.js" defer></script>
<script src="js/agenda.js" defer></script>
<script src="js/site.js" defer></script>
</head>
<body data-pagina="inicio">

<div class="cortina" aria-hidden="true"></div>

<main id="topo">

<!-- ===== CENA 01 · abertura ===== -->
<section class="abertura" id="abertura" data-topo aria-label="Abertura">
  <div class="abertura-img" id="abertura-img" role="img" aria-label="Ilustração da Brunna: uma guerreira cavalgando para fora de um portão de pedra"></div>
  <div class="vinheta"></div>
  <div class="barra-cine topo" aria-hidden="true"></div>
  <div class="barra-cine base" aria-hidden="true"></div>

  <div class="abertura-txt wrap">
    <p class="rotulo abertura-kicker"><span class="timecode">CENA 01</span> <span id="ab-kicker"></span></p>
    <h1 class="abertura-titulo t-cinema" id="ab-nome"></h1>
    <p class="abertura-frase t-mao" id="ab-frase"></p>
    <p class="abertura-legenda" id="ab-legenda"></p>
    <div class="abertura-ctas">
      <a class="btn cheio" href="encomendas.html">Crie seu personagem</a>
      <a class="btn" href="portfolio.html">Ver portfólio</a>
      <a class="btn trilha" id="ab-trilha" href="#" target="_blank" rel="noopener" hidden>
        <span aria-hidden="true">&#9654;</span> <span id="ab-trilha-txt"></span>
      </a>
    </div>
  </div>

  <div class="abertura-status" id="ab-status"></div>
  <a class="role" href="#creditos"><span>role para dar play</span><i aria-hidden="true"></i></a>
</section>

<!-- ===== créditos iniciais: links ===== -->
<section class="creditos-ini" id="creditos" aria-labelledby="creditos-t">
  <div class="wrap">
    <h2 class="rotulo creditos-t surge" id="creditos-t">créditos iniciais · onde me achar</h2>
    <div class="links" id="links"></div>
  </div>
</section>

<!-- ===== CENA 02 · ficha (pôster) ===== -->
<section class="ficha papel" id="ficha" aria-labelledby="ficha-nome">
  <div class="wrap ficha-in">
    <div class="ficha-topo surge">
      <img class="ficha-retrato js-avatar" id="ficha-retrato" src="assets/avatar.webp" width="150" height="150" alt="Autorretrato da Brunna em ilustração">
      <div>
        <p class="rotulo ficha-cena"><span class="timecode">CENA 02</span> ficha da personagem</p>
        <h2 class="ficha-nome t-poster" id="ficha-nome"></h2>
        <p class="ficha-lista" id="ficha-lista"></p>
      </div>
    </div>
    <p class="ficha-extra surge" id="ficha-extra"></p>

    <div class="ficha-palco">
      <p class="ficha-palavra t-poster" id="ficha-palavra" aria-hidden="true"></p>
      <img class="ficha-arte" id="ficha-arte" src="assets/hey.webp" width="1016" height="1016" alt="Ilustração da Brunna: a tiefling de cabelo rosa acenando" loading="lazy">
    </div>

    <div class="ficha-base">
      <p class="ficha-texto surge" id="ficha-texto"></p>
      <div class="ficha-lema surge">
        <p class="t-poster" id="ficha-lema"></p>
        <p class="rotulo">copyright <span id="ano"></span>&copy;</p>
        <div class="barcode" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== interlúdio 1 ===== -->
<section class="interludio" id="interludio1" aria-label="Interlúdio">
  <div class="interludio-img"></div>
  <div class="barra-cine topo" aria-hidden="true"></div>
  <div class="barra-cine base" aria-hidden="true"></div>
  <blockquote class="interludio-frase wrap surge">
    <p class="t-cinema"></p>
    <cite class="rotulo"></cite>
  </blockquote>
</section>

<!-- ===== próximas cenas: as outras páginas ===== -->
<section class="proximas" aria-labelledby="proximas-t">
  <div class="wrap">
    <h2 class="rotulo proximas-t surge" id="proximas-t">próximas cenas</h2>
    <div class="chamadas" id="chamadas"></div>
  </div>
</section>

<!-- ===== interlúdio 2 ===== -->
<section class="interludio" id="interludio2" aria-label="Interlúdio">
  <div class="interludio-img"></div>
  <div class="barra-cine topo" aria-hidden="true"></div>
  <div class="barra-cine base" aria-hidden="true"></div>
  <blockquote class="interludio-frase wrap surge">
    <p class="t-cinema"></p>
    <cite class="rotulo"></cite>
  </blockquote>
</section>

</main>

</body>
</html>
