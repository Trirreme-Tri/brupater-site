<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel da Bru</title>
<link rel="icon" href="assets/avatar.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<script src="js/dados.js"></script>
<script src="js/loja.js"></script>
<script src="js/tema.js"></script>
<script src="js/icones.js" defer></script>
<script src="js/agenda.js" defer></script>
<script src="js/admin.js" defer></script>
</head>
<body class="admin">

<!-- ===== login ===== -->
<main class="login" id="login" hidden>
  <div class="login-arte" aria-hidden="true"></div>
  <form class="login-caixa" id="login-form" autocomplete="on">
    <img class="login-avatar" src="assets/avatar.webp" width="150" height="150" alt="">
    <p class="rotulo">área restrita</p>
    <h1 class="t-cinema">Painel da Bru</h1>
    <p class="login-sub">Entre pra editar o site: agenda, preços, galeria, textos, cores e fontes.</p>
    <label class="campo"><span>Usuário</span><input id="login-usuario" type="text" autocomplete="username" required></label>
    <label class="campo"><span>Senha</span><input id="login-senha" type="password" autocomplete="current-password" required></label>
    <p class="erro" id="login-erro" hidden>Usuário ou senha incorretos.</p>
    <button class="btn cheio" type="submit">Entrar</button>
    <a class="login-voltar" href="index.html">&#8592; voltar para o site</a>
  </form>
</main>

<!-- ===== painel ===== -->
<div class="painel" id="painel" hidden>
  <header class="topo">
    <div class="topo-marca">
      <img class="js-avatar" src="assets/avatar.webp" width="150" height="150" alt="">
      <div><p class="rotulo">painel</p><h1 class="t-cinema">Painel da Bru</h1></div>
    </div>
    <div class="topo-acoes">
      <a class="btn" href="index.html" target="_blank" rel="noopener">Ver site &#8599;</a>
      <button class="btn" type="button" id="sair">Sair</button>
    </div>
  </header>

  <div class="painel-corpo">
    <nav class="abas" id="abas" aria-label="Seções do painel"></nav>
    <section class="aba" id="aba" aria-live="polite"></section>
  </div>
</div>

<!-- barra de salvar: aparece quando há mudança não salva -->
<div class="salvar" id="salvar" aria-hidden="true">
  <div class="salvar-in">
    <p><b>Alterações não salvas</b><span>O site só muda depois de salvar.</span></p>
    <div class="salvar-btns">
      <button class="btn" type="button" id="descartar">Descartar</button>
      <button class="btn cheio" type="button" id="salvar-btn">Salvar alterações</button>
    </div>
  </div>
</div>

<div class="aviso-flutuante" id="toast" role="status" aria-live="polite"></div>

<footer class="rodape rodape-mini">
  <p class="trirreme">Site desenvolvido pela <a href="https://trirreme.com" target="_blank" rel="noopener">TRIRREME</a></p>
</footer>
</body>
</html>
