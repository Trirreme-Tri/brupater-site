# Publica uma prévia do site no GitHub Pages a cada push na main.
# Endereço: https://trirreme-tri.github.io/brupater-site/
#
# O GitHub Pages só serve arquivos prontos e numa subpasta (/brupater-site),
# por isso usamos o modo estático com NEXT_PUBLIC_BASE_PATH.
# A hospedagem oficial continua sendo o Firebase (sem subpasta).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:estatico
        env:
          NEXT_PUBLIC_BASE_PATH: /brupater-site
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
